<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact with Mr. King</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-color: #f1f5f9;
            --btn-bg: rgba(51, 65, 85, 0.5);
            --focus-color: #38bdf8;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-color);
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        #cursor-light {
            position: fixed;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(255,0,255,0.4) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 999;
            transform: translate(-50%, -50%);
            mix-blend-mode: screen;
        }

        #snow {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 40px 25px;
            width: 320px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--btn-bg);
            border: none;
            border-radius: 50%;
            width: 35px; height: 35px;
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        h1 {
            font-size: 24px;
            color: var(--text-color);
            margin-bottom: 5px;
            margin-top: 10px;
        }

        .tagline {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 5px;
            font-weight: 600;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text-color);
            font-family: inherit;
            font-size: 13px;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--focus-color);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        textarea {
            resize: none;
            height: 100px;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #38bdf8;
            border: none;
            border-radius: 12px;
            color: #0f172a;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #0ea5e9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4);
        }
    </style>
</head>
<body>

    <div id="cursor-light"></div>
    <canvas id="snow"></canvas>

    <div class="card">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>

        <h1>Send Message</h1>
        <p class="tagline">Get in touch with Mr. King</p>

        <form id="emailForm">
            <div class="form-group">
                <label for="subject">SUBJECT</label>
                <input type="text" id="subject" placeholder="Enter subject" required>
            </div>

            <div class="form-group">
                <label for="message">YOUR MESSAGE</label>
                <textarea id="message" placeholder="Write your message here..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">OPEN GMAIL</button>
        </form>
    </div>

    <script>
        document.getElementById('emailForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const subject = encodeURIComponent(document.getElementById('subject').value);
            const message = encodeURIComponent(document.getElementById('message').value);
            window.location.href = `mailto:kingls0x889@gmail.com?subject=${subject}&body=${message}`;
        });

        const cursor = document.getElementById('cursor-light');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            const colors = ['rgba(255,0,255,0.4)', 'rgba(0,255,255,0.4)', 'rgba(0,255,0,0.4)'];
            cursor.style.background = `radial-gradient(circle, ${colors[Math.floor(Math.random()*colors.length)]} 0%, transparent 70%)`;
        });

        const canvas = document.getElementById('snow');
        const ctx = canvas.getContext('2d');
        let width, height, flakes = [];
        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            flakes = [];
            for (let i = 0; i < 50; i++) {
                flakes.push({ x: Math.random()*width, y: Math.random()*height, speed: Math.random()*2+1 });
            }
        }
        function draw() {
            ctx.clearRect(0, 0, width, height);
            ctx.font = '20px serif';
            flakes.forEach(f => {
                ctx.fillText('❄️', f.x, f.y);
                f.y += f.speed;
                if (f.y > height) f.y = -20;
            });
            requestAnimationFrame(draw);
        }
        init(); draw();
    </script>
</body>
                             </html>
