<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Link Manager</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a233a; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 500px; background: #111a2e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #00b4d8; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border: none; border-radius: 6px; background: #1b263b; color: #fff; }
        button { padding: 12px 20px; border: none; border-radius: 6px; background: #00b4d8; color: #fff; font-weight: bold; cursor: pointer; }
        .stats { font-size: 14px; margin-bottom: 15px; color: #90e0ef; font-weight: bold; }
        ul { list-style: none; padding: 0; }
        li { background: #1b263b; padding: 12px; margin-bottom: 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .link-text { word-break: break-all; font-size: 13px; }
        .btn-delete { background: #e63946; padding: 6px 12px; font-size: 12px; border: none; color: #fff; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>📹 Video Link Manager</h2>
    <div class="input-group">
        <input type="text" id="videoLink" placeholder="Paste your Catbox video link here...">
        <button onclick="addLink()">Add Link</button>
    </div>
    <div class="stats" id="totalCount">Total Uploaded: 0</div>
    <ul id="linkList"></ul>
</div>

<script>
    const API_BASE = "/api/videos";

    async function loadLinks() {
        try {
            const res = await fetch(API_BASE);
            const data = await res.json();
            document.getElementById("totalCount").innerText = `Total Uploaded: ${data.length}`;
            const listEl = document.getElementById("linkList");
            listEl.innerHTML = "";
            data.forEach((item, index) => {
                const li = document.createElement("li");
                li.innerHTML = `
                    <span class="link-text">${index + 1}. ${item.link}</span>
                    <button class="btn-delete" onclick="deleteLink('${item._id}')">Delete</button>
                `;
                listEl.appendChild(li);
            });
        } catch (err) { console.error(err); }
    }

    async function addLink() {
        const input = document.getElementById("videoLink");
        const link = input.value.trim();
        if (!link) return;
        try {
            const res = await fetch(API_BASE, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ link })
            });
            if (res.ok) { input.value = ""; loadLinks(); }
        } catch (err) { console.error(err); }
    }

    async function deleteLink(id) {
        if (!confirm("Delete this link?")) return;
        try {
            const res = await fetch(`${API_BASE}/${id}`, { method: "DELETE" });
            if (res.ok) loadLinks();
        } catch (err) { console.error(err); }
    }
    window.onload = loadLinks;
</script>
</body>
</html>
