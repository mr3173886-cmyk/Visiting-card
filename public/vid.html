<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roni's Video Link Manager</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #111a2e;
            color: #fff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #1b263b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        h2 { text-align: center; color: #00b4d8; margin-top: 0; }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #0d1b2a;
            color: #fff;
            font-size: 14px;
        }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background: #00b4d8;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { background: #0077b6; }
        .stats {
            font-size: 14px;
            margin-bottom: 10px;
            color: #90e0ef;
            font-weight: bold;
        }
        ul { list-style: none; padding: 0; margin: 0; }
        li {
            background: #0d1b2a;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .link-text {
            word-break: break-all;
            font-size: 13px;
            color: #e0e1dd;
        }
        .btn-delete {
            background: #e63946;
            padding: 6px 12px;
            font-size: 12px;
        }
        .btn-delete:hover { background: #c1121f; }
    </style>
</head>
<body>

<div class="container">
    <h2>📹 Video Link Manager</h2>
    
    <div class="input-group">
        <input type="text" id="videoLink" placeholder="Paste your Catbox video link here...">
        <button onclick="addLink()">Add Link</button>
    </div>

    <div class="stats" id="totalCount">Total Uploaded: 0</div>

    <ul id="linkList"></ul>
</div>

<script>
    // আপনার রেন্ডার ব্যাকএন্ড ইউআরএল
    const API_BASE = "https://visiting-card-f60f.onrender.com/api/videos";

    // সার্ভার থেকে সমস্ত লিংক লোড করার ফাংশন
    async function loadLinks() {
        try {
            const res = await fetch(API_BASE);
            const data = await res.json();
            const listEl = document.getElementById("linkList");
            const countEl = document.getElementById("totalCount");
            
            listEl.innerHTML = "";
            countEl.innerText = `Total Uploaded: ${data.length}`;

            data.forEach((item, index) => {
                const li = document.createElement("li");
                // এখানে item._id এর বদলে নতুন local file এর item.id সেট করা হয়েছে ডিলিটের জন্য
                li.innerHTML = `
                    <span class="link-text">${index + 1}. ${item.link}</span>
                    <button class="btn-delete" onclick="deleteLink('${item.id}')">Delete</button>
                `;
                listEl.appendChild(li);
            });
        } catch (err) {
            console.error("Error loading links:", err);
        }
    }

    // নতুন লিংক যোগ করার ফাংশন
    async function addLink() {
        const input = document.getElementById("videoLink");
        const link = input.value.trim();
        if (!link) return alert("Please enter a link!");

        try {
            const res = await fetch(API_BASE, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ link })
            });
            if (res.ok) {
                input.value = "";
                loadLinks();
            }
        } catch (err) {
            console.error("Error adding link:", err);
        }
    }

    // লিংক ডিলিট করার ফাংশন
    async function deleteLink(id) {
        if (!confirm("Are you sure you want to delete this link?")) return;
        try {
            const res = await fetch(`${API_BASE}/${id}`, { method: "DELETE" });
            if (res.ok) {
                loadLinks();
            }
        } catch (err) {
            console.error("Error deleting link:", err);
        }
    }

    // পেজ লোড হলে রান হবে
    window.onload = loadLinks;
</script>

</body>
</html>
